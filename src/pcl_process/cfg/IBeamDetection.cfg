#!/usr/bin/env python
# -*- coding: utf-8 -*-
"""
dynamic_reconfigure 配置文件 - 工字钢检测参数
支持运行时通过 rqt_reconfigure 动态调整所有检测参数
"""

PACKAGE = "pcl_process"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ========== 空间过滤参数 ==========
spatial = gen.add_group("Spatial_Filter")
spatial.add("max_distance", double_t, 0, "最大检测距离(米)", 6.0, 1.0, 20.0)
spatial.add("min_distance", double_t, 0, "最小检测距离(米)", 2.0, 0.0, 10.0)
spatial.add("min_height",   double_t, 0, "最小高度(米)",     1.5, 0.0, 5.0)
spatial.add("max_height",   double_t, 0, "最大高度(米)",     3.5, 1.0, 10.0)

# ========== 预处理参数 ==========
preprocess = gen.add_group("Preprocess")
preprocess.add("voxel_size",    double_t, 0, "体素降采样大小(米)",     0.02, 0.005, 0.1)
preprocess.add("sor_neighbors", int_t,    0, "统计滤波邻居数",        20,   5,     100)
preprocess.add("sor_std_ratio", double_t, 0, "统计滤波标准差比",      1.5,  0.5,   5.0)

# ========== 墙面移除参数 ==========
wall = gen.add_group("Wall_Removal")
wall.add("wall_distance_threshold", double_t, 0, "RANSAC距离阈值(米)",   0.08, 0.01, 0.5)
wall.add("min_wall_points",         int_t,    0, "最小墙面点数",         500,  50,   5000)
wall.add("max_wall_iterations",     int_t,    0, "最大墙面移除迭代次数", 3,    1,    10)

# ========== 聚类参数 ==========
cluster = gen.add_group("Clustering")
cluster.add("cluster_tolerance", double_t, 0, "DBSCAN聚类容差(米)", 0.18, 0.01, 1.0)
cluster.add("min_cluster_size",  int_t,    0, "最小聚类点数",       10,   2,    1000)

# ========== 聚类合并参数(第一轮 - 严格) ==========
merge_strict = gen.add_group("Merge_Strict")
merge_strict.add("merge_max_gap_strict",             double_t, 0, "严格合并-最大间隙(米)",     0.15, 0.01, 1.0)
merge_strict.add("merge_max_height_diff_strict",     double_t, 0, "严格合并-最大高度差(米)",   0.10, 0.01, 1.0)
merge_strict.add("merge_min_axis_similarity_strict", double_t, 0, "严格合并-最小轴向相似度",   0.98, 0.8,  1.0)

# ========== 聚类合并参数(第二轮 - 宽松) ==========
merge_loose = gen.add_group("Merge_Loose")
merge_loose.add("merge_max_gap_loose",             double_t, 0, "宽松合并-最大间隙(米)",     0.5,  0.05, 2.0)
merge_loose.add("merge_max_height_diff_loose",     double_t, 0, "宽松合并-最大高度差(米)",   0.15, 0.01, 1.0)
merge_loose.add("merge_min_axis_similarity_loose", double_t, 0, "宽松合并-最小轴向相似度",   0.96, 0.8,  1.0)

# ========== 工字钢判断阈值 ==========
ibeam_judge = gen.add_group("IBeam_Judgment")
ibeam_judge.add("min_linearity",    double_t, 0, "最小线性度",           0.9,  0.5,  1.0)
ibeam_judge.add("min_length",       double_t, 0, "最小长度(米)",         1.5,  0.5,  10.0)
ibeam_judge.add("min_aspect_ratio", double_t, 0, "最小长宽比",           2.5,  1.0,  20.0)
ibeam_judge.add("max_axis_z",       double_t, 0, "主轴Z分量最大值(水平性)", 0.1, 0.0,  1.0)
ibeam_judge.add("min_width",        double_t, 0, "最小宽度(米)",         0.1,  0.01, 2.0)
ibeam_judge.add("max_width",        double_t, 0, "最大宽度(米)",         1.2,  0.1,  5.0)
ibeam_judge.add("min_thickness",    double_t, 0, "最小厚度(米)",         0.03, 0.001, 1.0)
ibeam_judge.add("max_thickness",    double_t, 0, "最大厚度(米)",         0.8,  0.01, 2.0)

# ========== 精细化参数 ==========
refine = gen.add_group("Refinement")
refine.add("refine_max_v_span", double_t, 0, "最大翼缘宽度(米)", 0.50, 0.1, 2.0)
refine.add("refine_max_w_span", double_t, 0, "最大截面高度(米)", 0.60, 0.1, 2.0)
refine.add("refine_min_v_span", double_t, 0, "最小翼缘宽度(米)", 0.30, 0.01, 1.0)
refine.add("refine_min_w_span", double_t, 0, "最小截面高度(米)", 0.05, 0.01, 1.0)

# ========== 端部裁剪参数 ==========
trim = gen.add_group("Endpoint_Trimming")
trim.add("trim_outlier_ratio",      double_t, 0, "端部尺寸异常倍率(>典型值该倍数则裁掉)", 1.3, 1.0, 3.0)
trim.add("trim_v_shift_threshold",  double_t, 0, "截面v方向中心偏移阈值(米)",             0.05, 0.01, 0.3)
trim.add("trim_w_shift_threshold",  double_t, 0, "截面w方向中心偏移阈值(米)",             0.08, 0.01, 0.3)
trim.add("trim_aspect_diff_ratio",  double_t, 0, "截面长宽比偏差比例阈值",               0.5,  0.1,  2.0)
trim.add("trim_density_ratio_high", double_t, 0, "点密度上限倍率(高于则异常)",            2.5,  1.5,  10.0)
trim.add("trim_density_ratio_low",  double_t, 0, "点密度下限倍率(低于则异常)",            0.25, 0.05, 0.8)
trim.add("trim_score_ratio",        double_t, 0, "H型截面分数衰减比例阈值",              0.3,  0.05, 1.0)

# ========== 扩展参数 ==========
extend = gen.add_group("Extension")
extend.add("extend_min_target_length", double_t, 0, "扩展目标最小长度(米)", 3.5, 1.0, 20.0)
extend.add("extend_max_overshoot",    double_t, 0, "扩展时每侧超出原始聚类端点最大距离(米)", 1.0, 0.1, 2.0)

exit(gen.generate(PACKAGE, "ibeam_fitting_node", "IBeamDetection"))
