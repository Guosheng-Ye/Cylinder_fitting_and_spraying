#!/usr/bin/env python
# -*- coding: utf-8 -*-
"""
dynamic_reconfigure 配置文件 - 圆柱拟合检测参数
支持运行时通过 rqt_reconfigure 动态调整所有检测参数
"""

PACKAGE = "pcl_process"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ========== 圆柱模型拟合参数 ==========
model = gen.add_group("Cylinder_Model")
model.add("min_inliers",       int_t,    0, "最小内点数",           300,  10,   5000)
model.add("max_inliers",       int_t,    0, "最大内点数",           600,  50,   10000)
model.add("min_inlier_ratio",  double_t, 0, "最小内点比例",         0.02, 0.001, 1.0)
model.add("max_inlier_ratio",  double_t, 0, "最大内点比例",         0.50, 0.01,  1.0)
model.add("min_height_m",      double_t, 0, "最小高度(米)",         1.00, 0.1,   10.0)
model.add("min_radius_m",      double_t, 0, "最小半径(米)",         0.30, 0.01,  5.0)
model.add("max_radius_m",      double_t, 0, "最大半径(米)",         0.40, 0.01,  5.0)
model.add("min_radial_rel_std", double_t, 0, "最小径向相对标准差",   0.00, 0.0,   1.0)
model.add("max_radial_rel_std", double_t, 0, "最大径向相对标准差",   0.15, 0.0,   1.0)

# ========== RANSAC轴向约束参数 ==========
ransac_axis = gen.add_group("RANSAC_Axis")
ransac_axis.add("eps_angle_deg", double_t, 0, "RANSAC轴向容差(度)-偏离竖直轴超过此值的圆柱将被拒绝(竖直:10-15,倾斜:45-90)", 10.0, 1.0, 90.0)

# ========== RANSAC拟合参数 ==========
ransac_fit = gen.add_group("RANSAC_Fitting")
ransac_fit.add("normal_distance_weight",    double_t, 0, "法线距离权重(法线与几何距离的平衡,0~1)",   0.1,   0.0,   1.0)
ransac_fit.add("ransac_max_iterations",     int_t,    0, "RANSAC最大迭代次数(增大提高鲁棒性)",       10000, 100,   100000)
ransac_fit.add("ransac_distance_threshold", double_t, 0, "RANSAC距离阈值(米)-点到圆柱面距离内点判定", 0.015, 0.001, 0.5)

# ========== 圆柱验证阈值 ==========
validation = gen.add_group("Cylinder_Validation")
validation.add("max_radial_range_ratio", double_t, 0, "径向极差比上限(max_r-min_r)/mean_r",     0.30, 0.05, 1.0)
validation.add("min_aspect_ratio",       double_t, 0, "最小长宽比H/(2R)-过小说明太扁",          1.5,  0.5,  20.0)
validation.add("min_circularity",        double_t, 0, "最小圆度评分-低于此值拒绝",               0.15, 0.0,  1.0)

# ========== 法线估计参数 ==========
normal_est = gen.add_group("Normal_Estimation")
normal_est.add("normal_k_search", int_t, 0, "法线估计KNN搜索邻居数(增大更平滑但更慢)", 50, 5, 200)

# ========== 墙面移除参数 ==========
wall = gen.add_group("Wall_Removal")
wall.add("wall_angle_threshold",    double_t, 0, "墙面检测角度阈值(度)-法向量与Z轴夹角在90±此值内视为墙面", 15.0,  1.0,   45.0)
wall.add("wall_distance_threshold", double_t, 0, "墙面RANSAC距离阈值(米)",                                0.02,  0.001, 0.5)
wall.add("wall_max_iterations",     int_t,    0, "墙面RANSAC最大迭代次数",                                5000,  100,   50000)
wall.add("max_walls",               int_t,    0, "最多检测/移除的墙面数",                                  2,     0,     10)
wall.add("wall_min_plane_points",   int_t,    0, "墙面最小平面内点数-少于停止检测",                         100,   10,    5000)
wall.add("wall_min_keep_ratio",     double_t, 0, "墙面移除后最少保留点云比例(安全阈值)",                    0.15,  0.05,  0.5)

# ========== 轴向校正参数(切片阶段) ==========
axis = gen.add_group("Axis_Correction")
axis.add("use_ideal_axis",           bool_t,   0, "是否使用理想竖直轴向(0,0,1)-倾斜圆柱应设为false", True)
axis.add("axis_angle_threshold_deg", double_t, 0, "拟合轴向与竖直方向夹角阈值(度)", 15.0, 0.0, 90.0)

# ========== 虚拟原点参数 ==========
vbase = gen.add_group("Virtual_Base")
vbase.add("virtual_base_to_surface", double_t, 0, "虚拟原点到圆柱表面的距离(mm)", 600.0, 0.0, 3000.0)

exit(gen.generate(PACKAGE, "cylinder_fitting_node", "CylinderDetection"))
