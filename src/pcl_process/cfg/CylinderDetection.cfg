#!/usr/bin/env python
# -*- coding: utf-8 -*-
"""
dynamic_reconfigure 配置文件 - 圆柱拟合检测参数
支持运行时通过 rqt_reconfigure 动态调整所有检测参数
"""

PACKAGE = "pcl_process"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ========== 圆柱模型拟合参数 ==========
model = gen.add_group("Cylinder_Model")
model.add("min_inliers",       int_t,    0, "最小内点数",           300,  10,   5000)
model.add("max_inliers",       int_t,    0, "最大内点数",           600,  50,   10000)
model.add("min_inlier_ratio",  double_t, 0, "最小内点比例",         0.02, 0.001, 1.0)
model.add("max_inlier_ratio",  double_t, 0, "最大内点比例",         0.50, 0.01,  1.0)
model.add("min_height_m",      double_t, 0, "最小高度(米)",         1.00, 0.1,   10.0)
model.add("min_radius_m",      double_t, 0, "最小半径(米)",         0.30, 0.01,  5.0)
model.add("max_radius_m",      double_t, 0, "最大半径(米)",         0.40, 0.01,  5.0)
model.add("min_radial_rel_std", double_t, 0, "最小径向相对标准差",   0.00, 0.0,   1.0)
model.add("max_radial_rel_std", double_t, 0, "最大径向相对标准差",   0.15, 0.0,   1.0)

# ========== 轴向校正参数 ==========
axis = gen.add_group("Axis_Correction")
axis.add("use_ideal_axis",           bool_t,   0, "是否使用理想竖直轴向(0,0,1)", True)
axis.add("axis_angle_threshold_deg", double_t, 0, "拟合轴向与竖直方向夹角阈值(度)", 15.0, 0.0, 90.0)

# ========== 虚拟原点参数 ==========
vbase = gen.add_group("Virtual_Base")
vbase.add("virtual_base_to_surface", double_t, 0, "虚拟原点到圆柱表面的距离(mm)", 600.0, 0.0, 3000.0)

exit(gen.generate(PACKAGE, "cylinder_fitting_node", "CylinderDetection"))
